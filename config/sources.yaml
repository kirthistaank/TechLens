# Source registry for TechLens.
# Add or remove sources here without touching application code.
# source_type: rss | substack | web

sources:

  # ── Phase 1 sources ──────────────────────────────────────────

  - id: deeplearning_ai_batch
    name: "DeepLearning.AI — The Batch"
    source_type: web
    listing_url: "https://www.deeplearning.ai/the-batch/tag/letters/"
    home_url: "https://www.deeplearning.ai/the-batch/"
    # Requires at least one hyphen in slug — excludes nav pages like /the-batch/about
    link_pattern: 'href="(/the-batch/[a-z0-9][a-z0-9-]*-[a-z0-9][a-z0-9-]*)"'
    priority: 5
    categories: [ai_ml, agentic_ai, enterprise_ai]
    polling_frequency_minutes: 360
    enabled: true

